            if (selection) {
                const selStart = Math.min(selection.start, selection.end);
                const selEnd = Math.max(selection.start, selection.end);
                const startX = selStart * displayWidth;
                const endX = selEnd * displayWidth;

                ctx.fillStyle = 'rgba(239, 68, 68, 0.15)';
                ctx.fillRect(startX, 0, endX - startX, displayHeight);

                ctx.strokeStyle = '#ef4444';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(startX, 0);
                ctx.lineTo(startX, displayHeight);
                ctx.moveTo(endX, 0);
                ctx.lineTo(endX, displayHeight);
                ctx.stroke();
            }

            // Draw scrubber playhead
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(progressX, 0);
            ctx.lineTo(progressX, displayHeight);
            ctx.stroke();

            // Draw playhead dot
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(progressX, displayHeight / 2, 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function drawRoundedRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w, y + h - r);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
            ctx.fill();
        }

        function bufferToWav(buffer) {
            let numOfChan = buffer.numberOfChannels,
                length = buffer.length * numOfChan * 2 + 44,
                bufferArr = new ArrayBuffer(length),
                view = new DataView(bufferArr),
                channels = [], i, sample,
                offset = 0,
                pos = 0;

            function setUint16(data) {
                view.setUint16(pos, data, true);
                pos += 2;
            }

            function setUint32(data) {
                view.setUint32(pos, data, true);
                pos += 4;
            }

            setUint32(0x46464952);                         // "RIFF"
            setUint32(length - 8);                         // file length - 8
            setUint32(0x45564157);                         // "WAVE"

            setUint32(0x20746d66);                         // "fmt " chunk
            setUint32(16);                                 // chunk length
            setUint16(1);                                  // raw PCM format
            setUint16(numOfChan);
            setUint32(buffer.sampleRate);
            setUint32(buffer.sampleRate * 2 * numOfChan);  // byte rate
            setUint16(numOfChan * 2);                      // block align
            setUint16(16);                                 // bits per sample

            setUint32(0x61746164);                         // "data" chunk
            setUint32(length - pos - 4);                   // chunk length

            for (i = 0; i < buffer.numberOfChannels; i++)
                channels.push(buffer.getChannelData(i));

            while (pos < length) {
                for (i = 0; i < numOfChan; i++) {
                    sample = Math.max(-1, Math.min(1, channels[i][offset]));
                    sample = (sample < 0 ? sample * 0x8000 : sample * 0x7FFF);
                    view.setInt16(pos, sample, true);
                    pos += 2;
                }
                offset++;
            }

            return new Blob([bufferArr], { type: 'audio/wav' });
        }

        function bufferToMp3(buffer, bitrate = 128) {
            const mp3encoder = new lamejs.Mp3Encoder(buffer.numberOfChannels, buffer.sampleRate, bitrate);
            const mp3Data = [];
            
            const sampleBlockSize = 1152;
            const left = buffer.getChannelData(0);
            const right = buffer.numberOfChannels > 1 ? buffer.getChannelData(1) : null;
            
            const lp = new Int16Array(left.length);
            const rp = right ? new Int16Array(right.length) : null;
            
            for (let i = 0; i < left.length; i++) {
                let s = Math.max(-1, Math.min(1, left[i]));
                lp[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                if (rp) {
                    s = Math.max(-1, Math.min(1, right[i]));
                    rp[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                }
            }
            
            for (let i = 0; i < lp.length; i += sampleBlockSize) {
                const leftChunk = lp.subarray(i, i + sampleBlockSize);
                let mp3buf;
                if (rp) {
                    const rightChunk = rp.subarray(i, i + sampleBlockSize);
                    mp3buf = mp3encoder.encodeBuffer(leftChunk, rightChunk);
                } else {
                    mp3buf = mp3encoder.encodeBuffer(leftChunk);
                }
                if (mp3buf.length > 0) {
                    mp3Data.push(mp3buf);
                }
            }
            
            const mp3buf = mp3encoder.flush();
            if (mp3buf.length > 0) {
                mp3Data.push(mp3buf);
            }
            
            return new Blob(mp3Data, { type: 'audio/mp3' });
        }

        function toggleSelection(e, id) {
            const item = e.currentTarget;
            item.classList.toggle('selected');
            updateBulkActions();
        }

        function updateBulkActions() {
            const selectedCount = document.querySelectorAll('.recording-item.selected').length;
            const allCount = document.querySelectorAll('.recording-item').length;

            if (selectedCount > 0) {
                bulkActions.classList.add('visible');
                recordBtn.classList.add('bulk-visible');
                const btnContent = selectAllBtn.querySelector('svg').outerHTML + (selectedCount === allCount ? ' Deselect All' : ' Select All');
                selectAllBtn.innerHTML = btnContent;
            } else {
                bulkActions.classList.remove('visible');
                recordBtn.classList.remove('bulk-visible');
                const btnContent = selectAllBtn.querySelector('svg').outerHTML + ' Select All';
                selectAllBtn.innerHTML = btnContent;
            }
        }

        function toggleSelectAll() {
            const allItems = document.querySelectorAll('.recording-item');
            const selectedItems = document.querySelectorAll('.recording-item.selected');

            if (selectedItems.length === allItems.length) {
                allItems.forEach(item => item.classList.remove('selected'));
            } else {
                allItems.forEach(item => item.classList.add('selected'));
            }
            updateBulkActions();
        }

        function getRecording(id) {
            return recordings.find(r => r.id === id);
        }

        function downloadRecording(e, id) {
            e.stopPropagation();
            const rec = getRecording(id);
            const a = document.createElement('a');
            a.href = rec.url;
            a.download = rec.filename;
            a.click();
        }

        async function shareRecording(e, id) {
            e.stopPropagation();
            const rec = getRecording(id);
            if (navigator.share) {
                try {
                    const mimeType = rec.filename.endsWith('.mp3') ? 'audio/mp3' : 'audio/wav';
                    const file = new File([rec.blob], rec.filename, { type: mimeType });
                    await navigator.share({ files: [file], title: rec.filename });
                } catch (err) { console.log('Share failed:', err); }
            } else {
                alert('Sharing not supported.');
            }
        }

        // Modal Logic
        let pendingDeleteId = null;
        let pendingDeleteType = null; // 'single' or 'bulk'
        const deleteModal = document.getElementById('deleteModal');
        const modalText = document.getElementById('modalText');

        function openDeleteModal(type, id = null, count = 0) {
            pendingDeleteType = type;
            pendingDeleteId = id;
            if (type === 'single') {
                modalText.innerText = "This will permanently delete the recording.";
            } else {
                modalText.innerText = `This will permanently delete ${count} recordings.`;
            }
            deleteModal.classList.add('active');
        }

        function closeDeleteModal() {
            deleteModal.classList.remove('active');
            pendingDeleteId = null;
            pendingDeleteType = null;
        }

        function confirmDelete() {
            if (pendingDeleteType === 'single' && pendingDeleteId) {
                // Execute Single Delete
                const id = pendingDeleteId;
                const rec = getRecording(id);
                if (rec && rec.audio) {
                    rec.audio.pause();
                }
                const index = recordings.findIndex(r => r.id === id);
                if (index > -1) recordings.splice(index, 1);
                deleteRecordingFromDB(id);
                const el = document.querySelector(`.recording-item[data-id="${id}"]`);
                if (el) el.remove();
                updateBulkActions();
            } else if (pendingDeleteType === 'bulk') {
                // Execute Bulk Delete
                const ids = getSelectedIds();
                ids.forEach(id => {
                    const rec = getRecording(id);
                    if (rec && rec.audio) {
                        rec.audio.pause();
                    }
                    const index = recordings.findIndex(r => r.id === id);
                    if (index > -1) recordings.splice(index, 1);
                    deleteRecordingFromDB(id);
                    const el = document.querySelector(`.recording-item[data-id="${id}"]`);
                    if (el) el.remove();
                });
                clearSelection();
            }
            closeDeleteModal();
        }

        let discardConfirmCallback = null;

        function openConfirmDiscardModal(onConfirm) {
            discardConfirmCallback = onConfirm;
            document.getElementById('confirmDiscardModal').classList.add('active');
        }

        function closeConfirmDiscardModal() {
            document.getElementById('confirmDiscardModal').classList.remove('active');
            discardConfirmCallback = null;
        }

        function handleConfirmDiscard() {
            if (discardConfirmCallback) discardConfirmCallback();
            closeConfirmDiscardModal();
        }

        function deleteRecording(e, id) {
            e.stopPropagation();
            openDeleteModal('single', id);
        }

        function getSelectedIds() {
            return Array.from(document.querySelectorAll('.recording-item.selected'))
                .map(el => el.dataset.id);
        }

        function clearSelection() {
            document.querySelectorAll('.recording-item.selected').forEach(el => el.classList.remove('selected'));
            updateBulkActions();
        }

        function handleBulkDownload() {
            const ids = getSelectedIds();
            ids.forEach(id => {
                const rec = getRecording(id);
                const a = document.createElement('a');
                a.href = rec.url;
                a.download = rec.filename;
                a.click();
            });
            clearSelection();
        }

        function handleBulkDelete() {
            const ids = getSelectedIds();
            if (!ids.length) return;
            openDeleteModal('bulk', null, ids.length);
        }

        function handleBulkShare() {
            const ids = getSelectedIds();
            if (!ids.length) return;

            if (navigator.share) {
                const files = ids.map(id => {
                    const rec = getRecording(id);
                    const mimeType = rec.filename.endsWith('.mp3') ? 'audio/mp3' : 'audio/wav';
                    return new File([rec.blob], rec.filename, { type: mimeType });
                });
                navigator.share({ 
                    files, 
                    title: `${files.length} Voice Recordings`,
                    text: files.map(f => f.name).join(', ')
                }).catch(e => console.log(e));
            } else { alert('Bulk share not supported'); }
            clearSelection();
        }

        function formatTime(seconds) {
            if (isNaN(seconds)) return "00:00";
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = Math.floor(seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }
    </script>
</body>
